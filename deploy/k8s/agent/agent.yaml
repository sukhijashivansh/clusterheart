# ClusterHeart SRE Agent — OBSERVE-ONLY, registry-free install.
#
# No container registry needed: a tiny public alpine base fetches the prebuilt
# agent binary (published to public Vercel Blob) and runs it. Read-only access
# only — matches what the collector reads, including recent logs of failing
# pods. No mutating verbs, no exec, no portforward, no Secret values.
#
# Deploy (CLUSTER_ID + AGENT_TOKEN come from control-plane registration):
#   kubectl create namespace clusterheart-sre
#   kubectl -n clusterheart-sre create secret generic clusterheart-agent \
#     --from-literal=CONTROLPLANE_URL=https://clusterheart-server.clusterheart.com/cp \
#     --from-literal=CLUSTER_ID=<clu_...> \
#     --from-literal=AGENT_TOKEN=<token>
#   kubectl apply -f deploy/k8s/agent/agent.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: clusterheart-sre
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusterheart-agent
  namespace: clusterheart-sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterheart-agent-observe
rules:
  - apiGroups: [""]
    resources: [nodes, pods, events]
    verbs: [get, list, watch]
  # Recent logs of failing pods (crash-looping, OOMKilled, failed), so incidents,
  # the Health tab and AI diagnosis can show what went wrong. Read-only; lines
  # are scrubbed of secret-looking values before they leave the cluster.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # Live CPU/memory from metrics-server (read-only). If metrics-server is
  # absent the agent just omits usage - this grant is harmless when unused.
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
  - nonResourceURLs: ["/version", "/version/"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusterheart-agent-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusterheart-agent-observe
subjects:
  - kind: ServiceAccount
    name: clusterheart-agent
    namespace: clusterheart-sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterheart-agent
  namespace: clusterheart-sre
  labels: { app: clusterheart-agent }
spec:
  replicas: 1
  selector:
    matchLabels: { app: clusterheart-agent }
  template:
    metadata:
      labels: { app: clusterheart-agent }
    spec:
      serviceAccountName: clusterheart-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "fetching agent binary..."
              wget -qO /work/agent "$AGENT_BINARY_URL"
              chmod +x /work/agent
              exec /work/agent
          env:
            - name: AGENT_BINARY_URL
              value: "https://0s9ykblnlp7vbe8p.public.blob.vercel-storage.com/sre/clusterheart-agent-linux-amd64"
            - { name: COLLECT_INTERVAL, value: "30s" }
          envFrom:
            - secretRef: { name: clusterheart-agent }
          volumeMounts:
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: work
          emptyDir: {}
