# Optional: MongoDB backing store for Clusterheart's rightsizing history.
# The dashboard connects to it via MONGO_URI (mongodb://clusterheart-mongo:27017,
# already wired in clusterheart.yaml). Skip this file to run without history —
# the app degrades gracefully and the rightsizing tab reports it's unavailable.
#
#   kubectl apply -f deploy/k8s/mongo.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clusterheart-mongo
  namespace: clusterheart
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterheart-mongo
  namespace: clusterheart
  labels: { app: clusterheart-mongo }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO volume — don't run two at once
  selector:
    matchLabels: { app: clusterheart-mongo }
  template:
    metadata:
      labels: { app: clusterheart-mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clusterheart-mongo
---
apiVersion: v1
kind: Service
metadata:
  name: clusterheart-mongo
  namespace: clusterheart
  labels: { app: clusterheart-mongo }
spec:
  selector: { app: clusterheart-mongo }
  ports:
    - port: 27017
      targetPort: 27017
