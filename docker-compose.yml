# MongoDB backing store for clusterheart's usage history (rightsizing analysis).
# The dashboard binary connects to mongodb://localhost:27017 by default; override
# with the MONGO_URI env var. Data persists in the named volume across restarts.
#
#   docker compose up -d      # start MongoDB
#   docker compose down       # stop it (keeps data)
#   docker compose down -v    # stop and wipe history
services:
  mongo:
    image: mongo:7
    container_name: clusterheart-mongo
    ports:
      - "27017:27017"
    volumes:
      - clusterheart-mongo:/data/db
    restart: unless-stopped

volumes:
  clusterheart-mongo:
