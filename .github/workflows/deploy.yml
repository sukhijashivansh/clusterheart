name: Deploy server

# Builds the account server (server/) as a static Linux binary and ships it to
# the VPS over SSH, then restarts the systemd unit. Only the binary is copied —
# server/.env, secret.key and MongoDB data on the box are left untouched.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {} # lets you trigger a deploy by hand from the Actions tab

# Never let two deploys race each other onto the same box.
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  # --- EDIT THESE to match the VPS ---
  REMOTE_DIR: /root/clusterheart/server # dir holding the binary + .env on the server
  SERVICE_NAME: clusterheart # systemd unit name -> `systemctl restart <name>`

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing DEPLOY_SSH_HOST"
          [ -z "$SSH_USER" ] && missing="$missing DEPLOY_SSH_USER"
          [ -z "$SSHPASS" ]  && missing="$missing DEPLOY_SSH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — set with 'gh secret set <NAME>', then re-run."
            exit 1
          fi
          echo "All deploy secrets present."

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build static Linux binary
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o clusterheart-server .

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy binary to server
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }} # read by `sshpass -e`
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT" \
            server/clusterheart-server \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/clusterheart-server.new"

      - name: Install & restart
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # REMOTE_DIR / SERVICE come from the job env above; the heredoc is
          # single-quoted so nothing expands locally — only on the server.
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' SERVICE='$SERVICE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          # root needs no sudo; otherwise require passwordless sudo for systemctl
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo -n"
          cd "$REMOTE_DIR"
          chmod +x clusterheart-server.new
          mv -f clusterheart-server.new clusterheart-server   # atomic swap
          $SUDO systemctl restart "$SERVICE"
          sleep 2
          $SUDO systemctl is-active "$SERVICE"                 # fails job if not running
          echo "✓ $SERVICE restarted with new binary"
          REMOTE
