name: Release desktop app

# Builds the Clusterheart desktop app for macOS, Windows and Linux and attaches
# the installers to a GitHub Release, so anyone can download them.
#
# How to cut a release:
#   1. Bump "version" in electron/package.json (e.g. 1.0.1).
#   2. git tag v1.0.1 && git push origin v1.0.1
#   3. This workflow builds all three platforms and uploads them to a DRAFT
#      release for that tag. Open Releases, review, and hit "Publish".
#
# The download page is then:  https://github.com/Decodx09/clusterheart/releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # lets you run a build by hand from the Actions tab

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # --- build the Go dashboard binaries the app bundles per platform ---
      - name: Build dashboard (macOS)
        if: runner.os == 'macOS'
        run: |
          cd app
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-darwin-amd64 .

      - name: Build dashboard (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd app
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-windows-amd64.exe .

      - name: Build dashboard (Linux)
        if: runner.os == 'Linux'
        run: |
          cd app
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-linux-arm64 .

      - name: Install app deps
        working-directory: electron
        run: npm ci

      # electron-builder publishes to a draft release for the pushed tag.
      # GH_TOKEN uses the built-in token — no extra secret needed.
      - name: Build & publish installers
        working-directory: electron
        run: npx electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
