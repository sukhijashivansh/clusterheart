name: Build & ship installers

# Builds the desktop app for macOS, Windows and Linux, then copies the
# installers to the server's downloads folder over SSH — so they're served
# from the app's own home page (/downloads/…). Nothing is published to a
# public GitHub release; the source stays in this private repo.
#
# Trigger: push a tag (git tag v1.0.1 && git push origin v1.0.1) or run it
# by hand from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Build dashboard (macOS)
        if: runner.os == 'macOS'
        run: |
          cd app
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-darwin-amd64 .
      - name: Build dashboard (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd app
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-windows-amd64.exe .
      - name: Build dashboard (Linux)
        if: runner.os == 'Linux'
        run: |
          cd app
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-linux-arm64 .

      - name: Install app deps
        working-directory: electron
        run: npm ci
      - name: Build installers
        working-directory: electron
        run: npx electron-builder ${{ matrix.platform }} --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find electron/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  ship:
    needs: build
    runs-on: ubuntu-latest
    env:
      REMOTE_DOWNLOADS: /root/clusterheart/server/downloads
    steps:
      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing DEPLOY_SSH_HOST"
          [ -z "$SSH_USER" ] && missing="$missing DEPLOY_SSH_USER"
          [ -z "$SSHPASS" ]  && missing="$missing DEPLOY_SSH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true

      - name: Add friendly filenames
        run: |
          cd dl
          shopt -s nullglob
          for f in *mac*arm64*.dmg; do cp "$f" Clusterheart-macOS-AppleSilicon.dmg; done
          for f in *mac*x64*.dmg;   do cp "$f" Clusterheart-macOS-Intel.dmg; done
          for f in *win*.exe;       do cp "$f" Clusterheart-Windows.exe; done
          for f in *linux*x64*.AppImage *linux*x86_64*.AppImage; do cp "$f" Clusterheart-Linux.AppImage; done
          ls -la

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Ship installers to the server
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DOWNLOADS"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT" \
            dl/* "$SSH_USER@$SSH_HOST:$REMOTE_DOWNLOADS/"
          echo "✓ installers copied to $REMOTE_DOWNLOADS — live at /downloads/"
