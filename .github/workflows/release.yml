name: Build & ship installers

# Builds the desktop app for macOS (Apple Silicon) and uploads the installer to
# the public Vercel Blob store. The landing page (clusterheart.com, hosted on
# Vercel) links to that blob via /downloads/… redirects in vercel.json — so
# there's no server to ship to. The source stays private.
#
# Trigger: push a tag (git tag v1.0.1 && git push origin v1.0.1) or run it
# by hand from the Actions tab.
#
# Required repo secret: BLOB_READ_WRITE_TOKEN (read-write token for the
# clusterheart-downloads Vercel Blob store).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # Intel runners (macos-13) have far better availability than the
    # capacity-constrained macos-latest (arm64); we cross-package the arm64 DMG.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Build dashboard (macOS, arm64)
        run: |
          cd app
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-darwin-arm64 .

      - name: Install app deps
        working-directory: electron
        run: npm ci
      - name: Build installers
        working-directory: electron
        run: npx electron-builder --mac --publish never

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          find electron/dist -maxdepth 1 -type f -name '*.dmg' -exec cp {} out/ \;
          ls -la out
      # Upload the .dmg straight to the Vercel Blob store under a stable name
      # (overwrite), so the download link in vercel.json never changes.
      - name: Publish to Vercel Blob
        working-directory: electron
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Missing repo secret BLOB_READ_WRITE_TOKEN — set it with 'gh secret set BLOB_READ_WRITE_TOKEN', then re-run."
            exit 1
          fi
          npm install --no-save @vercel/blob
          node scripts/upload-blob.mjs "$GITHUB_WORKSPACE/out"
