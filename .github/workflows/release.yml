name: Build & ship installers

# Builds the desktop app for macOS, Windows and Linux, then uploads the
# installers to the public Vercel Blob store. The landing page (clusterheart.com,
# hosted on Vercel) links to those blobs via /downloads/… redirects in
# vercel.json — so there's no server to ship to. The source stays private.
#
# Trigger: push a tag (git tag v1.0.1 && git push origin v1.0.1) or run it
# by hand from the Actions tab.
#
# Required repo secret: BLOB_READ_WRITE_TOKEN (read-write token for the
# clusterheart-downloads Vercel Blob store).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Build dashboard (macOS)
        if: runner.os == 'macOS'
        run: |
          cd app
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-darwin-arm64 .
      - name: Build dashboard (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd app
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-windows-amd64.exe .
      - name: Build dashboard (Linux)
        if: runner.os == 'Linux'
        run: |
          cd app
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../electron/resources/clusterheart-linux-arm64 .

      - name: Install app deps
        working-directory: electron
        run: npm ci
      - name: Build installers
        working-directory: electron
        run: npx electron-builder ${{ matrix.platform }} --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find electron/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out
      # Upload this platform's installers straight to the Vercel Blob store.
      # Each build job publishes its own files (deterministic names, overwrite),
      # so there's no artifact hand-off — avoids the Actions artifact storage
      # quota that previously broke the release.
      - name: Publish to Vercel Blob
        working-directory: electron
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Missing repo secret BLOB_READ_WRITE_TOKEN — set it with 'gh secret set BLOB_READ_WRITE_TOKEN', then re-run."
            exit 1
          fi
          npm install --no-save @vercel/blob
          node scripts/upload-blob.mjs "$GITHUB_WORKSPACE/out"
