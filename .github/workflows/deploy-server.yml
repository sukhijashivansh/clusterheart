# Auto-deploy the Go account server (server/) to the VPS/EC2 box on every
# push to main that touches server/**. Builds a static Linux binary in CI,
# copies it over SSH, swaps it into /opt/clusterheart, and restarts the
# systemd unit (see deploy/clusterheart.service).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_HOST     - server hostname or IP
#   DEPLOY_SSH_USER     - ssh user (e.g. ubuntu or root)
#   DEPLOY_SSH_KEY      - private key (.pem contents) for the ssh user, or
#   DEPLOY_SSH_PASSWORD - the user's ssh password (set one of the two)
#   DEPLOY_SSH_PORT     - (optional) ssh port; defaults to 22
#   OPENROUTER_API_KEY  - (optional) AI chat key; written into the service's
#                         .env on each deploy so it never lives in the repo
# Optional repo variable:
#   DEPLOY_ARCH         - target CPU arch: amd64 (default) or arm64 (Graviton)
#
# The ssh user must be root, or have passwordless sudo for `install` and
# `systemctl restart clusterheart`.

name: Deploy account server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Build static Linux binary
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
        run: go build -trimpath -ldflags="-s -w" -o clusterheart-server .

      - name: Copy binary to server (staging dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: server/clusterheart-server
          target: clusterheart-deploy
          strip_components: 1

      - name: Install binary and restart service
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          envs: OPENROUTER_API_KEY
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            SUDO=""
            [ "$(id -u)" -ne 0 ] && SUDO="sudo"
            UNIT=clusterheart
            # Install to the exact binary the running service points at, so we
            # can't miss if it lives in /root/clusterheart instead of /opt.
            BIN=$($SUDO systemctl show -p ExecStart --value "$UNIT" 2>/dev/null | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -1)
            [ -z "$BIN" ] && BIN=/opt/clusterheart/clusterheart-server
            echo "Deploying to unit=$UNIT bin=$BIN"
            $SUDO install -m 0755 "$HOME/clusterheart-deploy/clusterheart-server" "$BIN"
            rm -rf "$HOME/clusterheart-deploy"
            # Sync secrets into the .env the service reads: systemd's
            # EnvironmentFile if set, else the unit's working directory.
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              ENVF=$($SUDO systemctl show -p EnvironmentFiles --value "$UNIT" 2>/dev/null | awk '{print $1}' | head -1)
              if [ -z "$ENVF" ]; then
                WD=$($SUDO systemctl show -p WorkingDirectory --value "$UNIT" 2>/dev/null)
                ENVF="${WD:-$(dirname "$BIN")}/.env"
              fi
              $SUDO touch "$ENVF"
              $SUDO sed -i '/^OPENROUTER_API_KEY=/d' "$ENVF"
              echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" | $SUDO tee -a "$ENVF" >/dev/null
              echo "Updated OPENROUTER_API_KEY in $ENVF"
            fi
            $SUDO systemctl restart "$UNIT"
            sleep 2
            $SUDO systemctl is-active "$UNIT"
